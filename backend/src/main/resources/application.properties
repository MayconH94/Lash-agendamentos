spring.application.name=lash-backend

# Conexão com o PostgreSQL do Docker
spring.datasource.url=jdbc:postgresql://localhost:5432/lash_db
spring.datasource.username=admin
spring.datasource.password=secretpassword

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway (controla as versões do banco)
spring.flyway.enabled=true

# Autenticação (valores de desenvolvimento; em produção use variáveis de ambiente)
app.jwt.secret=${JWT_SECRET:troque-esta-chave-dev-com-mais-de-32-caracteres-123}
app.jwt.expiration-hours=8
app.admin.email=${ADMIN_EMAIL:profissional@lash.com}
app.admin.password=${ADMIN_PASSWORD:trocar123}
